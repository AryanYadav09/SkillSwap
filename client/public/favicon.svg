<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Brand Gold Gradient matching tailwind gold-400 (#dcaf4b) to gold-600 (#bb7420) -->
    <linearGradient id="ss-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="25%" stop-color="#EAB308" />
      <stop offset="65%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>
    
    <!-- Top-down glossy light sheen -->
    <linearGradient id="ss-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle inner border highlight -->
    <linearGradient id="ss-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.5" />
    </linearGradient>

    <!-- Soft drop shadow for obsidian emblem -->
    <filter id="ss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#ss-gold)" />
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#ss-sheen)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="10.5" stroke="url(#ss-stroke)" stroke-width="1" fill="none" />

  <!-- Obsidian Brand Sparkles Motif -->
  <g fill="#0F172A" filter="url(#ss-shadow)">
    <!-- Primary Star -->
    <path d="M 20 14 Q 20 26 32 26 Q 20 26 20 38 Q 20 26 8 26 Q 20 26 20 14 Z" />
    <!-- Secondary Star (Top Right) -->
    <path d="M 34 8.5 Q 34 15 40.5 15 Q 34 15 34 21.5 Q 34 15 27.5 15 Q 34 15 34 8.5 Z" />
    <!-- Tertiary Star (Bottom Right) -->
    <path d="M 33 29.5 Q 33 34 37.5 34 Q 33 34 33 38.5 Q 33 34 28.5 34 Q 33 34 33 29.5 Z" />
  </g>
</svg>