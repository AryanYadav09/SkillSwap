<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Stitch Indigo & Cyan Gradient -->
    <linearGradient id="ss-stitch-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#3525cd" />
      <stop offset="100%" stop-color="#00687a" />
    </linearGradient>
    
    <!-- Glossy Sheen -->
    <linearGradient id="ss-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle border highlight -->
    <linearGradient id="ss-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c3c0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#57dffe" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="ss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1c30" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Squircle with Stitch Indigo Gradient -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ss-stitch-gradient)" filter="url(#ss-shadow)" />
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#ss-sheen)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="url(#ss-stroke)" stroke-width="1" fill="none" />

  <!-- Crisp White Reciprocal Sparkle Motif -->
  <g fill="#FFFFFF">
    <!-- Primary Star -->
    <path d="M 21 12 Q 21 24 33 24 Q 21 24 21 36 Q 21 24 9 24 Q 21 24 21 12 Z" opacity="0.98" />
    <!-- Secondary Sparkle (Top Right) -->
    <path d="M 33 8.5 Q 33 14 38.5 14 Q 33 14 33 19.5 Q 33 14 27.5 14 Q 33 14 33 8.5 Z" fill="#6ffbbe" />
    <!-- Small Accent Dot -->
    <circle cx="12" cy="33" r="1.5" fill="#acedff" opacity="0.9" />
  </g>
</svg>